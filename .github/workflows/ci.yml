name: Validate JevHunt
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-examples.txt
      - run: npm run build
      - run: npm test
      - run: npm run audit:project-seo -- --static
      - run: npm run test:examples
      - run: npm run check:static
      - run: npm run deploy:check

      - name: Validate retired Worker
        run: npx wrangler deploy --config workers/catalog-sync/wrangler.toml --dry-run --outdir=.cache/catalog-worker
