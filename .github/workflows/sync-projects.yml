name: Sync Jev projects

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-jev-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh catalog snapshot
        run: |
          npm test
          node tools/sync-projects.mjs
          npm run build
          npm test

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog-audit.json public/assets/js/projects.js public/index.html public/404.html public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m "chore: sync Jev project catalog"
          git push
